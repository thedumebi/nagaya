# Merging to master applies sites.yaml: Terraform first (DNS, secrets), then
# `nagaya apply` on the box (containers, Caddy, crontab).
name: Apply

on:
  push:
    branches: [master]
  workflow_dispatch:

# Never two applies at once, and never cancel one halfway.
concurrency:
  group: nagaya-apply
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  render:
    name: Render check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm render:check

  terraform:
    name: Terraform apply
    needs: render
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.TF_GITHUB_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.5
      - run: terraform init -input=false -backend-config=backend.hcl
      - run: terraform apply -input=false -auto-approve

  box:
    name: nagaya apply
    needs: terraform
    runs-on: ubuntu-latest
    env:
      HOST: ${{ secrets.NAGAYA_HOST }}
      KNOWN_HOSTS: ${{ secrets.NAGAYA_KNOWN_HOSTS }}
      SSH_KEY: ${{ secrets.NAGAYA_SSH_KEY }}
    steps:
      - name: Run nagaya apply on the box
        run: |
          if [ -z "$HOST" ] || [ -z "$SSH_KEY" ]; then
            echo "::notice::NAGAYA_HOST / NAGAYA_SSH_KEY not set yet (RUNBOOK.md §2.10); skipping the box."
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          # The key is pinned to `nagaya ssh-dispatch` on the box, which only
          # accepts "apply" or "deploy <project> <sha>".
          ssh -o StrictHostKeyChecking=yes -o BatchMode=yes "deploy@$HOST" apply
