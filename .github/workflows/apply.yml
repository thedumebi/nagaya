# Merging to master applies sites.yaml: Terraform first (DNS, secrets), then
# `nagaya apply` on the box (containers, Caddy, crontab), then Terraform's
# origin certificates onto the box (`nagaya install-certs`).
name: Apply

on:
  push:
    branches: [master]
  workflow_dispatch:

# Never two applies at once, and never cancel one halfway.
concurrency:
  group: nagaya-apply
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  render:
    name: Render check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm render:check

  terraform:
    name: Terraform apply
    needs: render
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    outputs:
      # {"<domain>": "<PEM>"}: public data. Empty when Terraform was skipped.
      origin_certificates: ${{ steps.certs.outputs.json }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.TF_GITHUB_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_SECRET_ACCESS_KEY }}
    steps:
      # First, so the job's working directory (terraform/) exists.
      - uses: actions/checkout@v7
      # Until RUNBOOK.md §4.4 adds these secrets there is nothing to apply
      # with: skip, green, instead of failing every push.
      - name: Terraform secrets present?
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "::notice::Terraform secrets not set yet (RUNBOOK.md §4.4); skipping Terraform."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secrets.outputs.ready == 'true'
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.5
          # The wrapper adds its own lines to stdout; `terraform output -json`
          # below must be JSON only.
          terraform_wrapper: false
      - if: steps.secrets.outputs.ready == 'true'
        run: terraform init -input=false -backend-config=backend.hcl
      - if: steps.secrets.outputs.ready == 'true'
        run: terraform apply -input=false -auto-approve
      # Replacing an Origin CA certificate revokes the old one, so whatever
      # Terraform holds now is what the box must serve (the box job installs it).
      - if: steps.secrets.outputs.ready == 'true'
        id: certs
        run: echo "json=$(terraform output -json origin_certificates | jq -c .)" >> "$GITHUB_OUTPUT"

  box:
    name: nagaya apply
    needs: terraform
    runs-on: ubuntu-latest
    env:
      HOST: ${{ secrets.NAGAYA_HOST }}
      KNOWN_HOSTS: ${{ secrets.NAGAYA_KNOWN_HOSTS }}
      SSH_KEY: ${{ secrets.NAGAYA_SSH_KEY }}
      # Set to "true" by RUNBOOK.md §5.1, after the first `nagaya apply` was
      # run by hand. Until then CI never touches the box.
      BOX_READY: ${{ vars.NAGAYA_BOX_READY }}
      ORIGIN_CERTIFICATES: ${{ needs.terraform.outputs.origin_certificates }}
    steps:
      - name: Run nagaya apply on the box
        run: |
          if [ "$BOX_READY" != "true" ]; then
            echo "::notice::Repo variable NAGAYA_BOX_READY is not \"true\" yet (RUNBOOK.md §5.1); skipping the box."
            exit 0
          fi
          if [ -z "$HOST" ] || [ -z "$SSH_KEY" ]; then
            echo "::notice::NAGAYA_HOST / NAGAYA_SSH_KEY not set yet (RUNBOOK.md §2.10); skipping the box."
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          # The key is pinned to `nagaya ssh-dispatch` on the box, which only
          # accepts "apply", "deploy <project> <sha>" or "install-certs".
          ssh -o StrictHostKeyChecking=yes -o BatchMode=yes "deploy@$HOST" apply
          # After apply, which pulls the nagaya that knows install-certs. The
          # box refuses a certificate not issued for its own key, and only
          # reloads Caddy when one changed (or Caddy serves an older one).
          if [ -n "$ORIGIN_CERTIFICATES" ] && [ "$ORIGIN_CERTIFICATES" != "{}" ]; then
            printf '%s' "$ORIGIN_CERTIFICATES" \
              | ssh -o StrictHostKeyChecking=yes -o BatchMode=yes "deploy@$HOST" install-certs
          else
            echo "::notice::No origin certificates from Terraform; leaving the box's as they are."
          fi
