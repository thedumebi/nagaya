# GENERATED by `pnpm render` from sites.yaml. Do not edit by hand; edit sites.yaml and re-render.
name: nagaya-core
services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - 443:443
    volumes:
      - /srv/nagaya/generated/caddy:/etc/caddy:ro
      - /srv/nagaya/certs:/certs:ro
      - /srv/nagaya/static:/srv/static:ro
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: 128m
    networks:
      - edge
    labels:
      dev.nagaya.project: nagaya-core
  pg-main:
    image: postgres:18-alpine
    container_name: pg-main
    restart: unless-stopped
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=100
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PG_SUPERUSER_PASSWORD:?run through dotenvx (nagaya does this)}
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - pg-main-data:/var/lib/postgresql
    shm_size: 128m
    mem_limit: 768m
    stop_grace_period: 60s
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      dev.nagaya.project: nagaya-core
  redis-futari:
    image: redis:8-alpine
    container_name: redis-futari
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - yes
      - --maxmemory
      - 96mb
    volumes:
      - redis-futari-data:/data
    mem_limit: 128m
    labels:
      dev.nagaya.project: nagaya-core
  redis-ofuma:
    image: redis:8-alpine
    container_name: redis-ofuma
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - yes
      - --maxmemory
      - 192mb
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - ${REDIS_PASSWORD_OFUMA:?run through dotenvx (nagaya does this)}
    volumes:
      - redis-ofuma-data:/data
    mem_limit: 256m
    labels:
      dev.nagaya.project: nagaya-core
networks:
  edge:
    name: edge
    external: true
volumes:
  caddy-data: {}
  caddy-config: {}
  pg-main-data: {}
  redis-futari-data: {}
  redis-ofuma-data: {}
