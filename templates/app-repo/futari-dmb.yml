# Copy to <repo>/.github/workflows/deploy-nagaya.yml (RUNBOOK.md §1.7).
#
# Builds the dmb images in CI, pushes them to GHCR, then asks the nagaya box
# to run them. Nothing is built on the box.
#
# Until this site is cut over (RUNBOOK.md §6), keep the `push:` trigger
# commented out: the old deploy-vps.yaml still deploys to Hetzner on push,
# and this workflow is run by hand to build images for the new box.
name: Deploy (nagaya)

on:
  # push:
  #   branches: [master]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy after building (untick to only build and push images)
        type: boolean
        default: false

concurrency:
  group: deploy-nagaya
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  PROJECT: futari-dmb
  IMAGE_PREFIX: ghcr.io/thedumebi/futari-dmb

jobs:
  changes:
    # Which services this push touches, so only those are built and
    # deployed (nagaya deploy --only). Shared code, dependencies and this
    # workflow count for every service. A manual run, a new branch or a
    # force-push deploys everything.
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.detect.outputs.services }}
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: detect
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          own_paths() {
            case "$1" in
              backend) echo '^dmb/backend/' ;;
              frontend) echo '^dmb/frontend/' ;;
            esac
          }
          build_entry() {
            case "$1" in
              backend) echo '{"service":"backend","dockerfile":"dmb/backend/Dockerfile"}' ;;
              frontend) echo '{"service":"frontend","dockerfile":"dmb/frontend/Dockerfile"}' ;;
            esac
          }
          shared='^(dmb/shared/|packages/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|turbo\.json$|\.dockerignore$|tsconfig[^/]*\.json$|\.github/workflows/deploy-nagaya\.yml$)'
          if [ "$EVENT" != push ] || [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ] \
             || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            changed=ALL
          else
            changed="$(git diff --name-only "$BEFORE" "$GITHUB_SHA")"
          fi
          services=() entries=()
          for service in backend frontend; do
            if [ "$changed" = ALL ] || grep -qE "$(own_paths "$service")|$shared" <<<"$changed"; then
              services+=("$service"); entries+=("$(build_entry "$service")")
            fi
          done
          echo "services=$(printf '%s\n' "${services[@]}" | jq -Rsc 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"
          echo "matrix=$(printf '%s\n' "${entries[@]}" | jq -sc '{include: .}')" >> "$GITHUB_OUTPUT"
          echo "Building and deploying: ${services[*]:-nothing, no service files changed}"

  test:
    name: Lint, typecheck, test
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No version: pnpm/action-setup reads packageManager from package.json,
      # and refuses a second, different version.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm i --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @dmb/shared build
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test

  build:
    name: Build ${{ matrix.service }}
    needs: [changes, test]
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy to nagaya
    needs: [changes, build]
    if: (github.event_name == 'push' || inputs.deploy) && needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    env:
      HOST: ${{ secrets.NAGAYA_HOST }}
      KNOWN_HOSTS: ${{ secrets.NAGAYA_KNOWN_HOSTS }}
      SSH_KEY: ${{ secrets.NAGAYA_SSH_KEY }}
    steps:
      - name: nagaya deploy
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          # The key is pinned to `nagaya ssh-dispatch`, which accepts only
          # "deploy <project> <sha> [--only <services>]" (and "apply"). nagaya pulls the images,
          # creates/updates the database role, starts the containers and
          # health-checks them, rolling back to the previous tag on failure.
          ssh -o StrictHostKeyChecking=yes -o BatchMode=yes "deploy@$HOST" \
            "deploy ${{ env.PROJECT }} ${{ github.sha }} --only ${{ join(fromJSON(needs.changes.outputs.services), ',') }}"
