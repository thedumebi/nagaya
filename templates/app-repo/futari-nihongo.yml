# Copy to <repo>/.github/workflows/deploy-nagaya.yml (RUNBOOK.md §1.7).
#
# Builds the nihongo images in CI, pushes them to GHCR, then asks the nagaya box
# to run them. Nothing is built on the box.
#
# Until this site is cut over (RUNBOOK.md §6), keep the `push:` trigger
# commented out: the old deploy-vps.yaml still deploys to Hetzner on push,
# and this workflow is run by hand to build images for the new box.
name: Deploy (nagaya)

on:
  # push:
  #   branches: [master]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy after building (untick to only build and push images)
        type: boolean
        default: false

concurrency:
  group: deploy-nagaya
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  PROJECT: futari-nihongo
  IMAGE_PREFIX: ghcr.io/thedumebi/futari-nihongo

jobs:
  test:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.13.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm i --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @nihongo/shared build
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test

  build:
    name: Build ${{ matrix.service }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: backend
            dockerfile: nihongo/backend/Dockerfile
          - service: frontend
            dockerfile: nihongo/frontend/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy to nagaya
    needs: build
    if: github.event_name == 'push' || inputs.deploy
    runs-on: ubuntu-latest
    env:
      HOST: ${{ secrets.NAGAYA_HOST }}
      KNOWN_HOSTS: ${{ secrets.NAGAYA_KNOWN_HOSTS }}
      SSH_KEY: ${{ secrets.NAGAYA_SSH_KEY }}
    steps:
      - name: nagaya deploy
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          # The key is pinned to `nagaya ssh-dispatch`, which accepts only
          # "deploy <project> <sha>" (and "apply"). nagaya pulls the images,
          # creates/updates the database role, starts the containers and
          # health-checks them, rolling back to the previous tag on failure.
          ssh -o StrictHostKeyChecking=yes -o BatchMode=yes "deploy@$HOST" \
            "deploy ${{ env.PROJECT }} ${{ github.sha }}"
